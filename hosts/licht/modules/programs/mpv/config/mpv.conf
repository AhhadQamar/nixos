# Skylake decodes H.264 and 8-bit HEVC in hardware
vo=gpu
hwdec=vaapi
profile=fast

# uosc draws its own progress bar and window controls
osd-bar=no
border=no

audio-channels=stereo
audio-normalize-downmix=no
# Allow boosting past 130 if a file is still quiet
volume-max=200

# Night mode (evens out quiet dialogue vs loud scenes).
# Starts OFF; Ctrl+n toggles it (see input.conf).
af=@night:!lavfi=[acompressor=threshold=-20dB:ratio=4:attack=20:release=250:makeup=6dB]

# Resume where you left off
save-position-on-quit=yes

# Load subs whose name merely contains the video's name; prefer English
sub-auto=fuzzy
slang=en,eng

# Default is "whatever directory mpv was launched from"
screenshot-directory=~/Pictures/Screenshots

# Only used when streaming (mpv <url>): cap at 1080p, prefer H.264 for hardware decode
ytdl-format=bestvideo[height<=1080][vcodec^=avc1]+bestaudio[ext=m4a]/bestvideo[height<=1080]+bestaudio/best[height<=1080]/best

# opt-in: mpv --profile=hq file.mkv (1080p, not 4K)
[hq]
profile=high-quality
vo=gpu-next
video-sync=display-resample
interpolation=yes
tscale=oversample

# opt-in: 4K files that stutter on the CPU
[lowcpu]
vd-lavc-skiploopfilter=all
vd-lavc-fast=yes
