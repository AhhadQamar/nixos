# Audio for the Quickshell music player, used by ytm / ytal / ytms (.zshrc).
# It is loaded on its own (--ignore-config), so the video settings in `config`
# do not apply. Files land as ~/Music/<artist>/<album>/<title>.m4a, the folder
# layout the player's library scan understands.

# Best audio. YouTube serves AAC in m4a, so this is normally not re-encoded.
-f ba[ext=m4a]/ba/b
-x
--audio-format m4a
--audio-quality 0

# Where it goes. Missing tags fall back: no album means the playlist title,
# then "Singles"; no artist means the uploader.
-o "~/Music/%(album_artist,artist,uploader|Unknown Artist)s/%(album,playlist_title|Singles)s/%(track,title)s.%(ext)s"

# Tags and cover art, readable by the player (ffprobe) and by any other player
--embed-metadata
--embed-thumbnail
--convert-thumbnails jpg
# Video thumbnails are 16:9; crop the cover to a centred square
--ppa "ThumbnailsConvertor+FFmpeg_o:-c:v mjpeg -vf crop=\"'if(gt(ih,iw),iw,ih)':'if(gt(iw,ih),ih,iw)'\""

# "Artist - Title" in the video title becomes proper artist and title tags
--parse-metadata "title:(?P<artist>.+?) - (?P<title>.+)"
# YouTube Music channels are named "Artist - Topic"
--replace-in-metadata "uploader,artist,album_artist" " - Topic$" ""
# Drop "(Official Video)", "[Lyrics]", "(Audio)" and the like from titles
--replace-in-metadata "title,track" "(?i)\s*[\(\[](official[^\)\]]*|lyrics?[^\)\]]*|audio|music video|video|visuali[sz]er|hd|hq|4k)[\)\]]" ""

# Skip what is already in ~/Music, and keep going when one item fails
--download-archive ~/Music/.yt-dlp-archive.txt
--no-overwrites
--ignore-errors
--concurrent-fragments 4

# Cut non-music parts (talking, intros) out of music videos. Slower, needs
# network, only works on videos that have segments, so it is opt-in:
# --sponsorblock-remove music_offtopic
