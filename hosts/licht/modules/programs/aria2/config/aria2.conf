# RPC
enable-rpc=true
rpc-listen-all=false
rpc-listen-port=6800
# Lets a browser extension talk to the daemon. The RPC secret is still needed,
# and the daemon only listens on this machine.
rpc-allow-origin-all=true

# Downloads: several at once, each cut into up to 16 pieces (the most aria2 allows)
dir=/home/licht/Downloads
max-concurrent-downloads=5
max-connection-per-server=16
min-split-size=1M
split=16
continue=true
always-resume=true
file-allocation=falloc
disk-cache=64M
auto-file-renaming=true
content-disposition-default-utf8=true
remote-time=true
uri-selector=adaptive
optimize-concurrent-downloads=true
# Some servers turn "aria2" away
user-agent=Mozilla/5.0 (X11; Linux x86_64; rv:130.0) Gecko/20100101 Firefox/130.0

# Flaky servers and connections: keep trying, then resume
max-tries=10
retry-wait=5
connect-timeout=15
timeout=30
max-resume-failure-tries=5

# BitTorrent
enable-dht=true
enable-peer-exchange=true
bt-enable-lpd=true
seed-ratio=1.0
seed-time=30
follow-torrent=true
bt-save-metadata=true
