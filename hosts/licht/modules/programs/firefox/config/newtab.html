<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Tab</title>
<!-- Nix swaps the placeholder in the link below for the full path of
     ~/.cache/wal/newtab-pywal.css (written by wal on every wallpaper change).
     If that file is missing or empty, the fallback colours below are used. -->
<link rel="stylesheet" href="@WAL_CSS@">
<style>
  :root {
    color-scheme: dark;
    --bg: var(--wal-bg, #16181d);
    --fg: var(--wal-fg, #d7dae0);
    --muted: var(--wal-c8, #7b8190);
    --accent: var(--wal-c4, #7aa2f7);
    --surface: var(--wal-c0, #1f2229);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    place-items: center;
    background: var(--bg);
    color: var(--fg);
    font-family: Rubik, system-ui, sans-serif;
  }
  main { width: min(560px, 90vw); text-align: center; }
  #time { font-size: clamp(3.5rem, 10vw, 6rem); font-weight: 300; letter-spacing: 0.02em; }
  #date { margin-top: 0.25rem; color: var(--muted); font-size: 1.05rem; }
  form { margin-top: 2.5rem; }
  input {
    width: 100%;
    padding: 0.85rem 1.2rem;
    font: inherit;
    color: var(--fg);
    background: var(--surface);
    border: 1px solid color-mix(in srgb, var(--fg) 14%, transparent);
    border-radius: 12px;
    outline: none;
  }
  input::placeholder { color: var(--muted); }
  input:focus { border-color: var(--accent); }
</style>
</head>
<body>
<main>
  <div id="time">--:--</div>
  <div id="date"></div>
  <!-- A plain GET to Google. Nothing is sent until you press Enter. -->
  <form action="https://www.google.com/search" method="get">
    <input name="q" type="search" placeholder="Search Google" autocomplete="off" autofocus>
  </form>
</main>
<script>
  const t = document.getElementById("time");
  const d = document.getElementById("date");
  function tick() {
    const now = new Date();
    t.textContent = now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hour12: false });
    d.textContent = now.toLocaleDateString([], { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  }
  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
