# True color passthrough, so pywal / kitty colors render correctly inside tmux
set -as terminal-overrides ",*:Tc"

# Panes should start at 1 too, to match windows
setw -g pane-base-index 1

# Copy-mode selections go to the Wayland clipboard
bind-key -T copy-mode-vi 'y' send-keys -X copy-pipe-and-cancel "wl-copy"

# Renumber windows when one closes, so there's never a gap
set -g renumber-windows on

# ── Prefix: Ctrl-Space instead of Ctrl-b ──────────────────
unbind C-b
set -g prefix C-Space
bind-key C-Space send-prefix

# ── Splits open where you already are, not back at $HOME ──
unbind %
unbind '"'
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ── Resize panes: prefix + Shift-hjkl, hold to repeat ─────
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Reload config after `u`, without restarting the session ──
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux config reloaded"

# ── Notify when something happens in a window you're not on ──
set -g monitor-activity on
set -g visual-activity off
set-hook -g alert-activity 'run-shell "notify-send \"tmux\" \"Activity in #{window_name} (#{session_name})\""'

# ── Status bar colors, generated from your current pywal palette ──
source-file -q ~/.cache/wal/colors-tmux.conf
