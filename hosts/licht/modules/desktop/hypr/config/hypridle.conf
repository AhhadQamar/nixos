general {
    lock_cmd = pidof hyprlock || hyprlock   # avoid multiple instances
    before_sleep_cmd = loginctl lock-session # lock before suspend
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'; qs ipc call nightlight reapply
    ignore_dbus_inhibit = false  # respect Firefox/Steam idle inhibit
}
listener {
    timeout = 120
    on-timeout = touch $XDG_RUNTIME_DIR/screentime-idle
    on-resume = rm -f $XDG_RUNTIME_DIR/screentime-idle
}

# 4 min: heads-up that the lock is coming
listener {
    timeout = 240
    on-timeout = notify-send "Locking in 1 minute..."
}

# 5 min: lock screen
listener {
    timeout = 300
    on-timeout = loginctl lock-session
    on-resume = notify-send "Welcome back!"
}

# 7 min: turn off display
listener {
    timeout = 420
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'; qs ipc call nightlight reapply
}

