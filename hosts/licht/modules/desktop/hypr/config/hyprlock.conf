# Fallback palette (same as quickshell/WalColors.fallback.qml). It comes BEFORE
# the source line so that, once `wal -i` has run, its values override these --
# but on a fresh install, or while colors-hyprlock.conf is still empty, the
# password field and clock are visible instead of undefined.
$text_color  = rgba(cdd6f4ff)
$outer_color = rgba(bac2de80)
$inner_color = rgba(1e1e2e66)
$check_color = rgba(a6e3a1ff)
$fail_color  = rgba(f38ba8ff)

# Overrides the above with $text_color, $outer_color, $inner_color,
# $check_color, $fail_color from whatever `wal -i` last generated.
source = ~/.cache/wal/colors-hyprlock.conf

general {
    hide_cursor = true
    grace = 0              # seconds before password required (0 = immediate)
    no_fade_in = false     # enable smooth fade-in
    disable_loading_bar = false
    ignore_empty_input = true
}

# ── Background ──────────────────────────────────────────────
background {
    monitor =
    path = ~/Pictures/Wallpapers/.current_wallpaper
    color = rgba(1e1e2eff)  # shown if the wallpaper link is missing
    blur_passes = 3
    blur_size = 7
    brightness = 0.75
    contrast = 0.9
    vibrancy = 0.2
    vibrancy_darkness = 0.0
}

# ── Clock ────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $text_color
    font_size = 90
    font_family = Noto Sans Bold
    position = 0, 200
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    color = $outer_color
    font_size = 22
    font_family = Noto Sans
    position = 0, 120
    halign = center
    valign = center
}

# ── Password field ───────────────────────────────────────────
input-field {
    monitor =
    size = 300, 55
    outline_thickness = 3
    dots_size = 0.3
    dots_spacing = 0.15
    dots_center = true
    dots_rounding = -1     # circular dots
    outer_color = $outer_color
    inner_color = $inner_color
    font_color = $text_color
    font_family = Noto Sans
    fade_on_empty = true
    fade_timeout = 2000
    placeholder_text = <i>Password</i>
    check_color = $check_color
    fail_color = $fail_color
    fail_text = <i>Wrong password... <b>($ATTEMPTS)</b></i>
    fail_timeout = 2000
    fail_transition = 300
    rounding = 15
    position = 0, -60
    halign = center
    valign = center
}

