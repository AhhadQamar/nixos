# Pulls in $text_color, $outer_color, $inner_color, $check_color,
# $fail_color from whatever `wal -i` last generated.
source = ~/.cache/wal/colors-hyprlock.conf

general {
    hide_cursor = true
    grace = 0              # seconds before password required (0 = immediate)
    no_fade_in = false     # enable smooth fade-in
    disable_loading_bar = false
    ignore_empty_input = true
}

# ── Background ──────────────────────────────────────────────
background {
    monitor =
    path = /home/licht/Pictures/Wallpapers/.current_wallpaper
    blur_passes = 3
    blur_size = 7
    brightness = 0.75
    contrast = 0.9
    vibrancy = 0.2
    vibrancy_darkness = 0.0
}

# ── Clock ────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $text_color
    font_size = 90
    font_family = Noto Sans Bold
    position = 0, 200
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    color = $outer_color
    font_size = 22
    font_family = Noto Sans
    position = 0, 120
    halign = center
    valign = center
}

# ── Password field ───────────────────────────────────────────
input-field {
    monitor =
    size = 300, 55
    outline_thickness = 3
    dots_size = 0.3
    dots_spacing = 0.15
    dots_center = true
    dots_rounding = -1     # circular dots
    outer_color = $outer_color
    inner_color = $inner_color
    font_color = $text_color
    font_family = Noto Sans
    fade_on_empty = true
    fade_timeout = 2000
    placeholder_text = <i>Password</i>
    check_color = $check_color
    fail_color = $fail_color
    fail_text = <i>Wrong password... <b>($ATTEMPTS)</b></i>
    fail_timeout = 2000
    fail_transition = 300
    rounding = 15
    position = 0, -60
    halign = center
    valign = center
}

