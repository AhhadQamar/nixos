# Luciole palette. `wal -i` writes this to ~/.cache/wal/colors-luciole.toml;
# `luciole-palette` then fills in @ACCENT@ and @ON_ACCENT@ (the same accent the
# shell and the folder icons use) and writes ~/.config/luciole/colors.toml,
# which Luciole reloads live.
[colors]
primary = "@ACCENT@"
on_primary = "@ON_ACCENT@"
primary_container = "{color8}"
on_primary_container = "{foreground}"

secondary = "@ACCENT@"
on_secondary = "@ON_ACCENT@"
secondary_container = "{color8}"
on_secondary_container = "{foreground}"

tertiary = "@ACCENT@"
on_tertiary = "@ON_ACCENT@"
tertiary_container = "{color8}"
on_tertiary_container = "{foreground}"

error = "{color1}"
on_error = "{background}"
error_container = "{color0}"
on_error_container = "{color1}"

surface = "{background}"
on_surface = "{foreground}"
on_surface_variant = "{color7}"
surface_container_low = "{background}"
surface_container = "{color0}"
surface_container_high = "{color8}"
surface_container_highest = "{color8}"
outline_variant = "{color8}"

shadow = "#000000"
scrim = "#000000"
hover = "@ACCENT@"
on_hover = "@ON_ACCENT@"
